default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Queues by priority (duke first, low last)
    - queues: [duke, critical, default, low, "*"]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
